[package]
name = "captui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Terminal UI to record the screen, a window, or a region with sound on wlroots Wayland."
repository = "https://github.com/hellia-be/captui"
readme = "README.md"

[lib]
name = "captui"
path = "src/lib.rs"

[[bin]]
name = "captui"
path = "src/main.rs"

[dependencies]
anyhow = "1"
crossterm = "0.28"
ratatui = "0.29"
