[package]
name = "captui"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Terminal UI to record the screen, a window, or a region with sound on wlroots Wayland."
repository = "https://github.com/hellia-be/captui"
readme = "README.md"

[lib]
name = "captui"
path = "src/lib.rs"

[[bin]]
name = "captui"
path = "src/main.rs"

[features]
identify = ["dep:smithay-client-toolkit"]

[dependencies]
anyhow = "1"
crossterm = "0.29"
directories = "6"
nix = { version = "0.31", features = ["signal", "process"] }
ratatui = "0.30"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
smithay-client-toolkit = { version = "0.21", optional = true, default-features = false }
